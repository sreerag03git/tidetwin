name: CI

# Paths are relative to the repository root, so this file assumes TideTwin IS
# the repository. That is the standalone layout produced by
# `git subtree split --prefix=tidetwin`; see DEPLOY.md section 2.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Solver verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1

      - name: Verify the shipped data has not drifted
        run: |
          python - <<'PY'
          from tidetwin.geometry.oc4 import load_tables
          from tidetwin.loads.noaa import REFERENCE_STATIONS, available_cached, load_pair, to_constituents
          t = load_tables()
          print(f"OC4 tables OK: {len(t.joints)} joints, {len(t.members)} members, "
                f"digest {t.digest}")
          cached = available_cached()
          assert len(cached) == len(REFERENCE_STATIONS), (
              f"only {len(cached)}/{len(REFERENCE_STATIONS)} tidal extractions committed")
          for p in cached:
              c = to_constituents(load_pair(p))
              i = c.index("M2")
              print(f"  {p.current_id:9s} M2 current {c.semi_major[i]:.3f} m/s, "
                    f"F={c.form_factor():.3f}, retrieved {c.citation.retrieved}")
          PY
        env:
          PYTHONPATH: .

      - name: Run the test suite
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Check the app imports
        run: python -c "import ast,sys; ast.parse(open('app.py').read()); print('app.py parses')"

  deploy-smoke:
    # Streamlit Cloud installs requirements.txt into a fresh container and runs
    # `streamlit run app.py`. The test job never does that - it runs pytest - so a
    # change that imports cleanly in tests but breaks the actual app boot (a
    # missing runtime dep, a module-level error, the "ImportError at the first
    # import" the deployed app kept showing) would pass CI and only fail on
    # deploy. This job reproduces the deploy: a clean environment with ONLY
    # requirements.txt, then boots the app headless and fails on any startup
    # error. It is the closest CI can get to the real Streamlit Cloud start.
    name: App boots like the deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install exactly what the deploy installs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot the app headless and require it to serve cleanly
        run: |
          set -euo pipefail
          streamlit run app.py \
            --server.headless true --server.port 8531 --server.address 127.0.0.1 \
            > boot.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8531/_stcore/health; then
              echo "health OK after ${i}0s"; break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::streamlit process died during boot"; cat boot.log; exit 1
            fi
            sleep 10
          done
          curl -sf -o /dev/null http://127.0.0.1:8531/_stcore/health \
            || { echo "::error::app never became healthy"; cat boot.log; exit 1; }
          # Let the first script run (bundle load, tab render) complete, then fail
          # on any error the app surfaced to its log.
          sleep 20
          if grep -qiE "Traceback|ImportError|ModuleNotFoundError|has encountered an error" boot.log; then
            echo "::error::the app logged a startup error"; cat boot.log; kill "$APP_PID"; exit 1
          fi
          echo "app booted and served cleanly"
          cat boot.log
          kill "$APP_PID" 2>/dev/null || true

  ledger:
    name: Regenerate the claims ledger
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 900 samples, not fewer: at this station C3 has not converged below about
      # 500, and the convergence guard correctly withholds the verdict when it
      # has not. A cheaper run would publish UNTESTABLE and say nothing.
      # No network is needed - the NOAA constants are committed.
      - name: Run the full analysis and rewrite the README table
        run: python scripts/run_ledger.py --samples 900 --quiet --out ledger.csv --readme README.md
        timeout-minutes: 30
        env:
          PYTHONPATH: .

      - name: Upload the stamped ledger
        uses: actions/upload-artifact@v4
        with:
          name: claims-ledger
          path: |
            ledger.csv

      - name: Commit the regenerated README table
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "claims table unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "CI: regenerate the claims ledger table"
          git push
