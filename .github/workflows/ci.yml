name: CI

on:
  push:
    paths:
      - "tidetwin/**"
      - "tests/**"
      - "data/**"
      - "scripts/**"
      - "app.py"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: tidetwin

jobs:
  test:
    name: Solver verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tidetwin/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1

      - name: Verify the shipped geometry has not drifted from its manifest
        run: |
          python - <<'PY'
          from tidetwin.geometry.oc4 import load_tables
          t = load_tables()
          print(f"OC4 tables OK: {len(t.joints)} joints, {len(t.members)} members, "
                f"digest {t.digest}")
          PY
        env:
          PYTHONPATH: .

      - name: Run the test suite
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Check the app imports
        run: python -c "import ast,sys; ast.parse(open('app.py').read()); print('app.py parses')"

  ledger:
    name: Regenerate the claims ledger
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tidetwin/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the full analysis and rewrite the README table
        run: python scripts/run_ledger.py --samples 80 --quiet --out ledger.csv --readme README.md
        env:
          PYTHONPATH: .

      - name: Upload the stamped ledger
        uses: actions/upload-artifact@v4
        with:
          name: claims-ledger
          path: |
            tidetwin/ledger.csv

      - name: Commit the regenerated README table
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "claims table unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "CI: regenerate the claims ledger table"
          git push
