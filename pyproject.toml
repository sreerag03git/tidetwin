[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidetwin"
version = "0.1.0"
description = "Adversarial test bench for the tidal-calibration fatigue digital twin claims"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["tidetwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]
markers = ["slow: full-pipeline runs; deselect with -m 'not slow'"]
